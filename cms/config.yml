# Sveltia CMS 設定
# 僅在本機 dev server 提供（astro.config.mjs 的 cmsAdmin plugin），不會部署到 GitHub Pages
# 使用：npm run dev 後開 http://localhost:4321/astro-seo-test/admin/
# 登入：按「Sign In with Token」，貼上 GitHub fine-grained token（此 repo 的 Contents 讀寫權限）
# 發布後 Sveltia 直接 commit 到 main，GitHub Actions 會自動建置部署

backend:
  name: github
  repo: CHINGHSIN1991/astro-seo-test
  branch: main

site_url: https://chinghsin1991.github.io/astro-seo-test
display_url: https://chinghsin1991.github.io/astro-seo-test

media_folder: public/images
public_folder: /images

# 中文為預設語系；新增條目時 zh / en 兩個語系都會建立，對應 src/content/<collection>/{zh,en}/<slug>.md
i18n:
  structure: multiple_folders
  locales: [zh, en]
  default_locale: zh
  initial_locales: all

# 檔名只允許 ASCII，避免中文標題變成中文檔名；實際檔名由各集合的 slug 欄位決定
slug:
  encoding: ascii
  clean_accents: true

output:
  omit_empty_optional_fields: true

collections:
  - name: updates
    label: 最新消息
    label_singular: 消息
    folder: src/content/updates
    create: true
    extension: md
    format: frontmatter
    i18n: true
    slug: '{{fields.slug}}'
    preview_path: updates/{{fields.slug}}
    sortable_fields: [date, title]
    summary: '{{title}}（{{date}}）'
    fields:
      - name: slug
        label: 網址代稱（slug）
        widget: string
        i18n: duplicate
        hint: 只能用小寫英文、數字與連字號，會成為檔名與網址，例如 partner-visit
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只能用小寫英文、數字與連字號']
      - name: title
        label: 標題
        widget: string
        i18n: true
      - name: date
        label: 日期
        widget: datetime
        type: date
        i18n: duplicate
      - name: category
        label: 分類
        widget: select
        i18n: duplicate
        options:
          - { label: 產品, value: product }
          - { label: 公司, value: company }
          - { label: 活動, value: event }
        default: product
      - name: excerpt
        label: 摘要
        widget: text
        i18n: true
      - name: image
        label: 主圖
        widget: image
        required: false
        i18n: duplicate
      - name: imageAlt
        label: 主圖替代文字
        widget: string
        required: false
        i18n: true
      - name: body
        label: 內文
        widget: markdown
        i18n: true

  - name: changelog
    label: 更新日誌
    label_singular: 日誌
    folder: src/content/changelog
    create: true
    extension: md
    format: frontmatter
    i18n: true
    slug: "{{date | date('YYYY-MM-DD')}}-{{fields.slug}}"
    preview_path: changelog
    sortable_fields: [date, title]
    summary: '{{title}}（{{date}}）'
    fields:
      - name: slug
        label: 網址代稱（slug）
        widget: string
        i18n: duplicate
        hint: 只能用小寫英文、數字與連字號，檔名會自動加上日期前綴，例如 skill-editor
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只能用小寫英文、數字與連字號']
      - name: title
        label: 標題
        widget: string
        i18n: true
      - name: date
        label: 日期
        widget: datetime
        type: date
        i18n: duplicate
      - name: intro
        label: 前言
        widget: text
        i18n: true
      - name: body
        label: 內文
        widget: markdown
        i18n: true
